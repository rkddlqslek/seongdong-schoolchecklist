<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>성동초등학교 안전점검 체크리스트</title>
  <link rel="icon" href="logo.jpg" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
    <script>
      window.addEventListener('load', function() {
        showCustomAlert("매월 4일 학교안전점검의 날입니다.\n담당구역 안전점검 체크리스트 작성 및 서명 후\n행정실로 제출부탁드립니다.");
      });

      function showCustomAlert(message, imagePath) {
        // 모달 배경
        const modal = document.createElement("div");
        modal.className = "custom-alert-modal";
        
        // 모달 내용
        const content = document.createElement("div");
        content.className = "custom-alert-content";
        
        // 이미지
        if (imagePath) {
          const img = document.createElement("img");
          img.src = imagePath;
          img.alt = "알림 이미지";
          img.className = "custom-alert-image";
          content.appendChild(img);
        }
        
        // 메시지
        const text = document.createElement("p");
        text.className = "custom-alert-text";
        text.innerHTML = message.replace(/\n/g, "<br>");
        content.appendChild(text);
        
        // 닫기 버튼
        const button = document.createElement("button");
        button.className = "custom-alert-button";
        button.textContent = "확인";
        button.addEventListener("click", () => {
          document.body.removeChild(modal);
        });
        content.appendChild(button);
        
        modal.appendChild(content);
        document.body.appendChild(modal);
      }
    </script>
</head>
<body>

  <header class="top-header">
    <div class="nav-container">
      <a href="#" class="brand" onclick="location.reload()">
        <img src="logo.jpg" alt="로고">
        <span>성동초등학교</span>
      </a>

      <nav id="topNav" class="top-nav"></nav>
    </div>
  </header>

  <div class="control-bar">
    <div class="control-group">
      <label>점검자 <input id="inspector" placeholder="성함을 입력해주세요"></label>
      <label>점검일 <input id="date" type="date"></label>
      <button id="signBtn" class="btn-sign" type="button">서명하기</button>
    </div>
  </div>

  <main class="main-content">
    <div class="paper">
      <header class="paper-header">
        <h1 id="page-title">YYYY년 MM월 학교안전점검 체크리스트</h1>
        <div class="header-top-row">
          <div class="header-left">
            <img src="logo.jpg" alt="로고" class="logo-icon">
            <div class="header-text">
              <div class="school-name">성동초등학교</div>
              <div class="area-info">위치: <span id="header-location-display">본관 1층</span></div>
            </div>
          </div>
          <div class="header-right">
            <span id="print-date"></span>
            <span class="divider">|</span>
            <span id="print-inspector-full">
              점검자: <span id="print-inspector-name"></span>
              <span class="sig-wrap">
                <span class="sig-line"></span>
                <img id="signature-img" class="signature" alt="서명">
              </span>
            </span>
          </div>
        </div>
      </header>

      <div class="checklist-section">
        <div class="section-title">
          <span class="badge">담당구역</span>
          <span id="area-display" class="current-area">상단메뉴에서 담당구역을 선택해주세요</span>
        </div>

        <table class="checklist-table">
          <thead>
            <tr>
              <th width="60%">점검항목</th>
              <th width="15%">상태</th>
              <th>특이사항</th>
            </tr>
          </thead>
          <tbody id="checklist-body">
            <tr><td colspan="3" style="padding:40px; color:#999;">
              상단 메뉴에서 담당구역을 선택시 체크리스트가 생성
            </td></tr>
          </tbody>
        </table>
      </div>

      <div class="action-bar">
        <button id="printBtn" onclick="window.print()">🖨️ 출력</button>
      </div>
    </div>
  </main>

</body>
</html>
